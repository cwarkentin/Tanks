name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-SDL2_net

      - name: Build
        shell: msys2 {0}
        run: make clean all

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Tanks-Windows
          path: build/bin/

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install sdl2 sdl2_ttf sdl2_image sdl2_mixer sdl2_net

      - name: Build
        run: make clean all

      - name: Upload Mac build
        uses: actions/upload-artifact@v4
        with:
          name: Tanks-Mac
          path: build/bin/